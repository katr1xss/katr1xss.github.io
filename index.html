        .star-field {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none; /* Чтобы можно было кликать сквозь звёзды */
  z-index: 0;
  overflow: hidden;
}

.star {
  position: absolute;
  background: #fff;
  border-radius: 50%;
  opacity: 0.5;
  animation: twinkle infinite alternate;
}

/* Позиции и анимация для каждой из 20 звёзд */
.star:nth-child(1) { width: 2px; height: 2px; top: 10%; left: 20%; animation-duration: 3s; }
.star:nth-child(2) { width: 3px; height: 3px; top: 5%; left: 80%; animation-duration: 5s; animation-delay: -1s; }
.star:nth-child(3) { width: 1px; height: 1px; top: 30%; left: 10%; animation-duration: 4s; }
.star:nth-child(4) { width: 4px; height: 4px; top: 70%; left: 50%; animation-duration: 6s; animation-delay: -2s; }
.star:nth-child(5) { width: 2px; height: 2px; top: 90%; left: 90%; animation-duration: 3.5s; }
.star:nth-child(6) { width: 3px; height: 3px; top: 40%; left: 30%; animation-duration: 4.5s; animation-delay: -0.5s; }
.star:nth-child(7) { width: 1px; height: 1px; top: 15%; left: 60%; animation-duration: 5.5s; }
.star:nth-child(8) { width: 2px; height: 2px; top: 60%; left: 15%; animation-duration: 3s; }
.star:nth-child(9) { width: 3px; height: 3px; top: 25%; left: 75%; animation-duration: 4s; animation-delay: -1.5s; }
.star:nth-child(10) { width: 1px; height: 1px; top: 85%; left: 5%; animation-duration: 5s; }
.star:nth-child(11) { width: 4px; height: 4px; top: 50%; left: 95%; animation-duration: 6.5s; animation-delay: -2.5s; }
.star:nth-child(12) { width: 2px; height: 2px; top: 5%; left: 40%; animation-duration: 3.2s; }
.star:nth-child(13) { width: 3px; height: 3px; top: 35%; left: 85%; animation-duration: 4.2s; animation-delay: -0.8s; }
.star:nth-child(14) { width: 1px; height: 1px; top: 75%; left: 25%; animation-duration: 5.2s; }
.star:nth-child(15) { width: 2px; height: 2px; top: 95%; left: 65%; animation-duration: 3.8s; }
.star:nth-child(16) { width: 3px; height: 3px; top: 10%; left: 55%; animation-duration: 4.8s; animation-delay: -1.2s; }
.star:nth-child(17) { width: 1px; height: 1px; top: 45%; left: 5%; animation-duration: 5.8s; }
.star:nth-child(18) { width: 2px; height: 2px; top: 65%; left: 80%; animation-duration: 3.4s; }
.star:nth-child(19) { width: 3px; height: 3px; top: 20%; left: 20%; animation-duration: 4.4s; animation-delay: -1.8s; }
.star:nth-child(20) { width: 1px; height: 1px; top: 80%; left: 45%; animation-duration: 5.4s; }

@keyframes twinkle {
  0% { opacity: 0.3; transform: scale(0.8); }
  100% { opacity: 1; transform: scale(1.2); }
}
